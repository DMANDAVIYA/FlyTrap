{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<section class="auth">
  <h1>Contact us</h1>
  {% if sent %}
    <p class="ok">Thanks, we got your message. Someone from our team will reply within one business day.</p>
  {% else %}
  <form method="post" action="/contact">
    <label>Name<input name="name" required></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Message<textarea name="message" rows="5" required></textarea></label>
    <div class="vh" aria-hidden="true"><label>Company website<input name="company_website" tabindex="-1" autocomplete="off"></label></div>
    <button class="btn" type="submit">Send</button>
  </form>
  {% endif %}
</section>
{% endblock %}
